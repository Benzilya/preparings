# Release Gate workflow confirmed by repository owner
name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - agent/project-foundation

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate package manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8'))"
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version
      - name: Regenerate lockfile for hotfix
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only --registry=https://registry.npmjs.org
      - name: Install dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Architecture
        run: pnpm architecture
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format
      - name: Build
        run: pnpm build
      - name: Upload regenerated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
