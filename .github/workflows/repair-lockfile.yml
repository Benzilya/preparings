name: Repair pnpm lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - hotfix/release-1-lockfile-quality
    paths:
      - .github/workflows/repair-lockfile.yml

permissions:
  contents: write

concurrency:
  group: repair-pnpm-lockfile-hotfix
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v5
        with:
          ref: hotfix/release-1-lockfile-quality
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version
      - name: Regenerate lockfile
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only --registry=https://registry.npmjs.org
          pnpm install --frozen-lockfile
      - name: Architecture
        run: pnpm architecture
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format
      - name: Build
        run: pnpm build
      - name: Commit verified lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix: regenerate pnpm lockfile" || exit 0
          git push origin HEAD:hotfix/release-1-lockfile-quality
