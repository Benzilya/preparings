name: Resolve pnpm lockfile

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch or commit to resolve
        required: true
        default: agent/project-foundation

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Resolve lockfile
        run: pnpm install --lockfile-only
      - name: Verify frozen install
        run: pnpm install --frozen-lockfile
      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: resolved-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
