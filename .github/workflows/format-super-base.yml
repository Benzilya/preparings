name: Format imported questions

on:
  workflow_dispatch:
  push:
    branches:
      - feature/import-super-base-questions
    paths:
      - .github/workflows/format-super-base.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/import-super-base-questions
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format imported question data
        run: pnpm exec prettier --write content/questions/super-base.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/questions/super-base.ts
          git diff --cached --check
          git commit -m "style: format imported study questions"
          git push origin HEAD:feature/import-super-base-questions
